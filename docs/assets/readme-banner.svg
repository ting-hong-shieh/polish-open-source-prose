<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Polish Open-Source Prose</title>
  <desc id="desc">A Codex skill for editing public project prose without losing facts or voice.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1110" cy="32" r="170" fill="#5eead4" opacity="0.08"/>
  <circle cx="880" cy="390" r="250" fill="#818cf8" opacity="0.11"/>

  <g transform="translate(72 58)">
    <rect width="238" height="34" rx="17" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.24"/>
    <circle cx="19" cy="17" r="5" fill="#5eead4"/>
    <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">CODEX SKILL · OPEN SOURCE</text>

    <text x="0" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="750" letter-spacing="-1.8">Polish Open-Source Prose</text>
    <text x="2" y="158" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="450">Edit public project prose without losing facts or voice.</text>

    <g transform="translate(2 202)" fill="#dbeafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">
      <circle cx="7" cy="-5" r="7" fill="#5eead4"/>
      <path d="M3 -5l3 3 6-7" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="0">Semantic safeguards</text>

      <circle cx="210" cy="-5" r="7" fill="#a5b4fc"/>
      <path d="M206 -5l3 3 6-7" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="227" y="0">zh-Hant-TW locale pack</text>

      <circle cx="475" cy="-5" r="7" fill="#f0abfc"/>
      <path d="M471 -5l3 3 6-7" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="492" y="0">28 forward cases</text>
    </g>
  </g>

</svg>
