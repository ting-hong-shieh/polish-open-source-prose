<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Polish Open-Source Prose</title>
  <desc id="desc">The standalone open editorial P appears beside the project name and tagline.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111111" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#f7f4ec"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <path d="M40 42h1120M40 318h1120" fill="none" stroke="#111111" stroke-opacity=".16"/>
  <path d="M52 28v304M1148 28v304" fill="none" stroke="#111111" stroke-opacity=".16"/>

  <rect x="54" y="58" width="244" height="244" rx="52" fill="#111111"/>
  <g transform="translate(51 64) scale(3.6)">
    <path fill="#f7f4ec" fill-rule="evenodd" d="M10 58V7h22c14 0 23 8 23 20s-9 20-23 20H22v11Zm12-41v20h10c7 0 12-4 12-10s-5-10-12-10Z"/>
