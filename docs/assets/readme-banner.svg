    <text x="0" y="174" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="750" letter-spacing="-4">Polish</text>
    <text x="0" y="236" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="400" letter-spacing="-1.2"><tspan>Open</tspan><tspan fill="#21a7a1">-</tspan><tspan>Source Prose</tspan></text>
    <text x="0" y="278" fill="#356f70" font-family="Arial, Helvetica, sans-serif" font-size="23">Keep the facts. Keep the voice.</text>

    <g transform="translate(0 315)" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing=".35">
